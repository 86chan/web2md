[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
# pycodestyle(E,W)・pyflakes(F)・isort(I)・pyupgrade(UP)・bugbear(B) を有効化
select = ["E", "W", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true

# 型スタブ未提供のサードパーティ製ライブラリは欠落インポートを許容
[[tool.mypy.overrides]]
module = [
    "bs4.*",
    "markdownify.*",
    "mdformat.*",
    "trafilatura.*",
    "responses.*",
]
ignore_missing_imports = true

# テストは未型付けデコレータ(parametrize/responses.activate)を許容
[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_decorators = false

[tool.pytest.ini_options]
testpaths = ["tests"]
